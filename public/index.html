<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventario - Salas de Ventas</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 900px;
        margin: 2rem auto;
        padding: 0 1rem;
        color: #333;
      }
      form {
        display: grid;
        grid-template-columns: 2fr 2fr 0.8fr 1.5fr auto auto;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
      }
      .filtros {
        display: grid;
        grid-template-columns: 2fr 1.5fr auto;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
        padding: 0.75rem;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 6px;
      }
      input,
      select,
      button {
        padding: 0.6rem;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 0.95rem;
      }
      button {
        background: #0f172a;
        color: white;
        border: none;
        cursor: pointer;
        font-weight: bold;
      }
      button:hover {
        background: #334155;
      }
      .btn-secondary {
        background: #64748b;
      }
      .btn-secondary:hover {
        background: #475569;
      }
      .btn-cancel {
        background: #64748b;
        display: none;
      }
      .btn-cancel:hover {
        background: #475569;
      }
      .btn-edit {
        background: #0284c7;
        padding: 0.3rem 0.6rem;
        font-size: 0.85rem;
        margin-right: 0.3rem;
      }
      .btn-edit:hover {
        background: #0369a1;
      }
      .btn-delete {
        background: #dc2626;
        padding: 0.3rem 0.6rem;
        font-size: 0.85rem;
      }
      .btn-delete:hover {
        background: #b91c1c;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        text-align: left;
        padding: 0.75rem;
        border-bottom: 1px solid #e2e8f0;
      }
      th {
        background: #f8fafc;
      }
      .empty-state {
        text-align: center;
        color: #64748b;
        padding: 1.5rem;
      }
      @media (max-width: 700px) {
        form,
        .filtros {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <h1>Inventario de Salas de Ventas</h1>

    <!-- Formulario de creación y edición -->
    <form id="form-inventario">
      <input type="hidden" id="item-id" />
      <input
        type="text"
        id="nombre"
        placeholder="Ej. Colchón Queen"
        required
        aria-label="Ingresar nombre del artículo"
      />
      <input
        type="text"
        id="sala_ventas"
        placeholder="Ej. Sala Proyecto Mirador"
        required
        aria-label="Seleccionar sala de ventas"
      />
      <input
        type="number"
        id="cantidad"
        value="1"
        min="1"
        required
        aria-label="Seleccionar cantidad"
      />
      <select id="estado" aria-label="Seleccionar estado">
        <option value="Disponible">Disponible</option>
        <option value="En uso">En uso (Apartamento Modelo)</option>
        <option value="Mantenimiento">Mantenimiento</option>
      </select>
      <button type="submit" id="btn-submit">Agregar</button>
      <button type="button" id="btn-cancel" class="btn-cancel">Cancelar</button>
    </form>

    <!-- Barra de búsqueda y filtro -->
    <section class="filtros" aria-label="Filtros de inventario">
      <input
        aria-label="Buscar artículo por nombre"
        type="search"
        id="filtro-nombre"
        placeholder="Buscar artículo por nombre..."
      />
      <select id="filtro-sala" aria-label="Filtrar por sala de ventas">
        <option value="">Todas las salas de ventas</option>
      </select>
      <button type="button" id="btn-limpiar-filtros" class="btn-secondary">
        Limpiar filtros
      </button>
    </section>

    <table>
      <thead>
        <tr>
          <th>Artículo</th>
          <th>Sala de Ventas</th>
          <th>Cant.</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tabla-cuerpo"></tbody>
    </table>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
